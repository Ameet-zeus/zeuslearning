<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XL</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="nav">
        <div class="logo">Excel</div>

        <div class="nav-section">
            <button class="nav-btn" onclick="AddHandlerInstance.addRowTop()">Add Row Top</button>
            <button class="nav-btn" onclick="AddHandlerInstance.addRowBottom()">Add Row Bottom</button>
            <button class="nav-btn" onclick="AddHandlerInstance.addColumnLeft()">Add Column Left</button>
            <button class="nav-btn" onclick="AddHandlerInstance.addColumnRight()">Add Column Right</button>
        </div>

        <div class="nav-section">
            <button class="nav-btn" id="undo-btn" onclick="undo()">Undo</button>
            <button class="nav-btn" id="redo-btn" onclick="redo()">Redo</button>
        </div>

        <div class="nav-section">
            <button class="nav-btn" onclick="copy()">Copy</button>
            <button class="nav-btn" onclick="paste()">Paste</button>
        </div>
        <div class="nav-section">
            <button class="nav-btn" onclick="document.getElementById('json-file-input').click()">Load JSON</button>
            <input type="file" id="json-file-input" accept="application/json" style="display:none" />
        </div>
    </div>

    <!-- initSheet.js -->

    <div class="status-bar">
        <div class="status-separator"></div>
        <div class="status-item">
            <span id="cell-reference">Cell: </span>
        </div>
        <div class="status-separator"></div>
        <div class="status-item">
            <span id="row-col-info">Row: , Col: </span>
        </div>
        <div class="status-separator"></div>
        <div class="status-item">
            <span id="selection-info">0 cell selected</span>
        </div>
        <div class="status-separator"></div>
        <div class="status-item">
            <span id="sum-info">Sum: 0</span>
        </div>
        <div class="status-separator"></div>
        <div class="status-item">
            <span id="count-info">Count: 0</span>
        </div>
        <div class="status-separator"></div>
        <div class="status-item">
            <span id="average-info">Average: 0</span>
        </div>
        <div class="status-separator"></div>
        <div class="max-info">
            <span id="max-info">Max: 0</span>
        </div>
        <div class="status-separator"></div>
        <div class="min-info">
            <span id="min-info">Min: 0</span>
        </div>
        <div class="status-separator"></div>
    </div>
    <script src="./script.js" type="module"></script>
</body>

</html>
